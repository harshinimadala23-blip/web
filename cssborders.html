<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORDER CSS</title>
</head>
<style>

   .box1 {
    border:3px dashed red;
    border-radius: 16px;
}

   .box2{
    border: 3px dotted rgb(218, 25, 83) ;
    border-radius: 16px;
   }

   .box3{
    border: 3px double rgb(64, 233, 22) ;
    border-radius: 16px;
   }
   .box4{
    border: 3px solid rgb(61, 50, 222) ;
    border-radius: 16px;
   }


</style>
<body>
    <h1>CSS borders</h1>

    <p>This paragraph has solid border</p>

    <p class="box1">This is a dash border.</p>

    <p class="box2">This is a dotted border.</p>

    <p class="box3">This is a double border</p>

    <p class="box4">This is a rounded border</p>

</body>
</html>
