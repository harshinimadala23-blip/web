<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Css</title>
</head>
<body>
    <h1 style="color: #d74a4a; text-align: center;">
        My website
    </h1>
    <!--The style is applied directly to this paragraph-->
    <p style="color:rgb(185, 147, 99); font-size: 20px">
        This is an example of inline CSS
    </p>
    <!-- Another element with its own style-->
     <button style="color:blue; background-color: black;">
        harshini
     </button>
</body>
</html>
