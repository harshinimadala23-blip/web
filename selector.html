<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS SELECTOR</title>
</head>
<style>

p{
  color: fuchsia;

}

h1{color: blue;
text-align: center;
background-color: cornflowerblue;}


/*2.class selector*/
.highlight{
    color: black;
    background-color:blue
}

/*3.ID selector*/
#special{
    color: aqua;
    font-size: 25px;
}
</style>
<body>


    <h1>css selector</h1>

    <!--Element selector-->
    <p>Harshini is a good girl</p>
    <p>She is a cutie girl</p>

<!---class selector-->
<P class="highlight">This is highlight text</P>
<h2 class="highlight">This heading also uses the class</h2>

<!--id selector-->
<p id="special">This is a special text</p>
</body>
</html>
